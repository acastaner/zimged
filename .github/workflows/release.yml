# zimged release (#41, spec §8.5 and §9).
#
# A pushed tag vX.Y.Z builds the release artifacts and publishes a GitHub release. GitHub runs no
# tests: the gate runs on the maintainer's machine (tools/local-ci/run.sh) and records a pass as a
# git note on the commit's tree. The gate-record job refuses any tree without that note, and every
# other job needs it. See packaging/README.md for the release checklist.
#
# Linux: tarball, .deb, .rpm, AUR PKGBUILD and a Flatpak bundle. Windows (#42): an MSI and a
# winget manifest. macOS (#42): an ad-hoc-signed zimged.app in a DMG, for arm64 and x64.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate-record:
    name: gate-record
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      rust: ${{ steps.meta.outputs.rust }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the gate records
        run: |
          if ! git fetch --no-tags origin refs/notes/gate:refs/notes/gate; then
            echo "::error::origin has no refs/notes/gate: run ./tools/local-ci/run.sh and push the note."
            exit 1
          fi

      - name: Refuse an ungated tree
        run: bash tools/local-ci/check-gate-record.sh HEAD

      - name: Check the tag, the version and the release notes
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          rust="$(bash tools/local-ci/check-toolchain-pin.sh .)"
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "::error::tag ${TAG} does not match the workspace version ${version} in Cargo.toml."
            exit 1
          fi
          if ! grep -q "<release version=\"${version}\"" packaging/linux/io.github.acastaner.zimged.metainfo.xml; then
            echo "::error::packaging/linux/io.github.acastaner.zimged.metainfo.xml has no <release version=\"${version}\">."
            exit 1
          fi
          python3 packaging/release_notes.py "${version}" > /dev/null
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "rust=${rust}" >> "${GITHUB_OUTPUT}"

      - name: Check the file associations
        # Every package lists exactly the formats zimged reads, and none makes it the default.
        run: python3 packaging/check_associations.py

  linux:
    name: linux (x86_64)
    needs: gate-record
    runs-on: ubuntu-24.04
    # The gate's base image (tools/local-ci/Dockerfile): the same toolchain, and Debian bookworm's
    # glibc 2.36, so the binary runs on any distribution at least that recent.
    container: rust:${{ needs.gate-record.outputs.rust }}-slim-bookworm
    env:
      CARGO_TERM_COLOR: never
      RUST: ${{ needs.gate-record.outputs.rust }}
    steps:
      - name: Install the build tools
        # git before checkout, so it is a real clone; dpkg-dev for cargo-deb's dpkg-shlibdeps.
        # cmake, make, g++, meson, ninja and nasm: the `avif` feature builds libavif and dav1d from
        # source and links them statically (#19, as in tools/local-ci/Dockerfile). curl,
        # libfontconfig1-dev and libfreetype-dev: skia-bindings downloads prebuilt Skia with curl and
        # links fontconfig and freetype (#25).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git dpkg-dev \
            cmake make g++ meson ninja-build nasm libfontconfig1-dev libfreetype-dev

      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        # rust-toolchain.toml says X.Y; the image installed it as X.Y.Z, which rustup treats as a
        # different toolchain (tools/local-ci/README.md, "Bumping Rust").
        run: |
          rustup toolchain install "${RUST}" --profile minimal
          bash tools/local-ci/check-toolchain-pin.sh . --rustc "$(rustc --version)"

      - name: Install the packagers
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

      - name: Build zimged
        run: cargo build --release --locked -p zimged --features avif

      - name: Fetch the tag's source archive for the PKGBUILD
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/source.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"

      - name: Package
        run: packaging/linux/build.sh dist tarball deb rpm pkgbuild "${RUNNER_TEMP}/source.tar.gz" flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  flatpak:
    name: flatpak (x86_64)
    needs: [gate-record, linux]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: dist/flatpak/io.github.acastaner.zimged.yml
          bundle: zimged-${{ needs.gate-record.outputs.version }}-x86_64.flatpak
          cache: false
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: zimged-${{ needs.gate-record.outputs.version }}-x86_64.flatpak
          if-no-files-found: error

  windows:
    name: windows (x86_64)
    needs: gate-record
    # windows-2022 ships the WiX Toolset v3 (cargo-wix needs v3); the install step adds it if not.
    runs-on: windows-2022
    env:
      CARGO_TERM_COLOR: never
      RUST: ${{ needs.gate-record.outputs.rust }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "${RUST}" --profile minimal
          bash tools/local-ci/check-toolchain-pin.sh . --rustc "$(rustc --version)"

      # The `avif` feature builds dav1d with meson, which takes the first C compiler on PATH; the
      # runner's PATH has MinGW gcc, whose objects MSVC can't link. This puts cl.exe first.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the build tools
        # meson, ninja and nasm for libavif and dav1d (#19; cmake is on the image). The WiX
        # Toolset v3 and cargo-wix for the MSI.
        # Git Bash's coreutils `link` would shadow MSVC's link.exe, which rustc runs from PATH once
        # the MSVC environment is set: remove it.
        run: |
          rm -f /usr/bin/link.exe
          python -m pip install --disable-pip-version-check meson ninja
          choco install nasm -y --no-progress
          echo 'C:\Program Files\NASM' >> "${GITHUB_PATH}"
          if [[ -z "${WIX:-}" ]]; then
            choco install wixtoolset --version 3.14.1 -y --no-progress
            echo 'WIX=C:\Program Files (x86)\WiX Toolset v3.14' >> "${GITHUB_ENV}"
          fi
          cargo install --locked cargo-wix@0.3.9

      - name: Build zimged
        run: cargo build --release --locked -p zimged --features avif

      - name: Package
        run: packaging/windows/build.sh dist msi winget

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  macos:
    name: macos (${{ matrix.arch }})
    needs: gate-record
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    # Native builds: libavif and dav1d build with meson/cmake for the host only.
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: never
      RUST: ${{ needs.gate-record.outputs.rust }}
      # Info.plist's LSMinimumSystemVersion.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "${RUST}" --profile minimal
          bash tools/local-ci/check-toolchain-pin.sh . --rustc "$(rustc --version)"

      - name: Install the build tools
        # meson, ninja and nasm for libavif and dav1d (#19); cmake is on the image.
        run: brew install meson ninja nasm

      - name: Build zimged
        run: cargo build --release --locked -p zimged --features avif

      - name: Package
        run: packaging/macos/build.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: release
    needs: [gate-record, linux, flatpak, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate-record.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the assets
        run: |
          mkdir assets
          cp artifacts/linux/*.tar.gz artifacts/linux/*.deb artifacts/linux/*.rpm assets/
          cp artifacts/flatpak/*.flatpak assets/
          tar --owner=0 --group=0 --numeric-owner -C artifacts/linux/aur \
            -czf "assets/zimged-${VERSION}-aur.tar.gz" PKGBUILD .SRCINFO
          cp artifacts/windows/*.msi assets/
          zip -j -X "assets/zimged-${VERSION}-winget.zip" artifacts/windows/winget/*.yaml
          cp artifacts/macos-arm64/*.dmg artifacts/macos-x64/*.dmg assets/
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets

      - name: Write the release notes
        run: python3 packaging/release_notes.py "${VERSION}" > "${RUNNER_TEMP}/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" assets/* --verify-tag \
            --title "zimged ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
