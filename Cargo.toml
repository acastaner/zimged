[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/acastaner/zimged"
publish = false

[workspace.dependencies]
zimged-core = { path = "crates/zimged-core" }
zimged-render = { path = "crates/zimged-render" }
zimged-codec = { path = "crates/zimged-codec" }
zimged-siblings = { path = "crates/zimged-siblings" }
zimged-platform = { path = "crates/zimged-platform" }

eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
egui = "0.37"
egui_kittest = { version = "0.37", features = ["eframe"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff"] }
# Little CMS, built from source and linked statically (§5.2 colour conversion).
lcms2 = { version = "6.1", features = ["static"] }
# libavif + dav1d (§5.1 AVIF read), built from source: needs cmake, meson, ninja and nasm.
libavif-sys = { version = "0.17", default-features = false, features = ["codec-dav1d"] }
fast_image_resize = "6"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
pollster = "0.4"
tempfile = "3"
# Prebuilt Skia binaries are downloaded at build time (binary-cache). The default features plus
# textlayout match a published binary set (`jpegd-jpege-pdf-textlayout`), so no C++ toolchain is
# needed; another feature set can force a from-source build (LLVM, Python, Ninja).
skia-safe = { version = "0.156", features = ["textlayout"] }
libc = "0.2"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
# Release artifacts ship stripped (#41): every package format gets the same binary.
strip = true

# Decoding a JPEG unoptimised is slow; optimise dependencies even in dev and test builds.
[profile.dev.package."*"]
opt-level = 3
