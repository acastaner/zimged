[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/acastaner/zimged"
publish = false

[workspace.dependencies]
zimged-core = { path = "crates/zimged-core" }
zimged-render = { path = "crates/zimged-render" }
zimged-codec = { path = "crates/zimged-codec" }
zimged-siblings = { path = "crates/zimged-siblings" }
zimged-platform = { path = "crates/zimged-platform" }

eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
egui = "0.37"
# egui's bundled fonts: the Step counter digits are drawn from one, so no system font is needed.
epaint_default_fonts = "0.37"
egui_kittest = { version = "0.37", features = ["eframe"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico", "tiff"] }
# Little CMS, built from source and linked statically (§5.2 colour conversion).
lcms2 = { version = "6.1", features = ["static"] }
# libavif + dav1d (§5.1 AVIF read), built from source: needs cmake, meson, ninja and nasm.
libavif-sys = { version = "0.17", default-features = false, features = ["codec-dav1d"] }
fast_image_resize = "6"
# libwebp (built from source with cc, linked statically) to write WebP, lossy and lossless (§5.1).
webp = { version = "0.3", default-features = false }
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
# The clipboard JSON of copied Annotations (§6.2).
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
pollster = "0.4"
# The system trash (§8.2). chrono is only for listing the trash, which zimged never does.
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
tempfile = "3"
# The clipboard (§8.1): clipboard-rs on Windows, macOS and X11; its `wayland` backend is
# wl-clipboard-rs (data-control), falling back to X11 (XWayland) without data-control.
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
# Prebuilt Skia binaries are downloaded at build time (binary-cache). The default features plus
# textlayout match a published binary set (`jpegd-jpege-pdf-textlayout`), so no C++ toolchain is
# needed; another feature set can force a from-source build (LLVM, Python, Ninja).
skia-safe = { version = "0.156", features = ["textlayout"] }
libc = "0.2"
# The Sibling directory watcher (§3.2).
notify = "8"
unicode-normalization = "0.1"
# Sibling ordering on Windows (StrCmpLogicalW, the NoStrCmpLogical policy) and macOS (§3.2).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_UI_Shell"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObjCRuntime"] }
# ICU4X collation with compiled-in CLDR data: the ICU that Dolphin's QCollator sits on (§3.2, #16).
icu_collator = "2.4"
icu_locale_core = "2.4"

[profile.release]
lto = "thin"
codegen-units = 4
# Release artifacts ship stripped (#41): every package format gets the same binary.
strip = true

# Full debug info made every test binary ~450 MB (Skia and the codecs are linked into each one);
# line tables keep file:line in panics and backtraces at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

# Decoding a JPEG unoptimised is slow; optimise dependencies even in dev and test builds.
[profile.dev.package."*"]
opt-level = 3
