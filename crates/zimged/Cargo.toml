[package]
name = "zimged"
description = "A small, very fast image viewer and quick editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# AVIF (libavif + dav1d, §5.1). Building it needs cmake, meson, ninja and nasm; release builds and
# the gate turn it on.
avif = ["zimged-codec/avif"]

[dependencies]
zimged-core.workspace = true
zimged-codec.workspace = true
zimged-platform.workspace = true
eframe.workspace = true
egui.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
