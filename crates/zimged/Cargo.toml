[package]
name = "zimged"
description = "A small, very fast image viewer and quick editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# AVIF (libavif + dav1d, §5.1). Building it needs cmake, meson, ninja and nasm; release builds and
# the gate turn it on.
avif = ["zimged-codec/avif"]

[dependencies]
zimged-core.workspace = true
zimged-codec.workspace = true
zimged-platform.workspace = true
zimged-siblings.workspace = true
zimged-render.workspace = true
toml.workspace = true
eframe.workspace = true
egui.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
# Golden PNGs (tests/golden) and generated fixtures.
image = { workspace = true, features = ["png"] }

# Linux packages (#41, spec §8.5), built by packaging/linux/build.sh (see packaging/README.md).
# Source paths are relative to this crate; target/release/zimged maps to the workspace target.
# winit and glutin dlopen the Wayland, X11 and GL libraries, so the shared-library scan can't see
# them: they are listed by hand. Neither package sets zimged as a default handler.
[package.metadata.deb]
maintainer = "Arnaud Castaner"
copyright = "2026, Arnaud Castaner"
section = "graphics"
priority = "optional"
extended-description = """\
zimged is a small, very fast image viewer and quick editor. The wheel or the arrow keys move \
through the other images in the same folder, and images can be marked up with shapes, text, \
numbered steps, highlights and blur, then saved or copied."""
depends = "$auto, libwayland-client0, libwayland-egl1, libxkbcommon0, libegl1, libgl1, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6"
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/zimged", "usr/bin/", "755"],
    ["../../packaging/linux/zimged.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/zimged.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/linux/io.github.acastaner.zimged.metainfo.xml", "usr/share/metainfo/", "644"],
]

[package.metadata.generate-rpm]
summary = "A small, very fast image viewer and quick editor"
assets = [
    { source = "target/release/zimged", dest = "/usr/bin/zimged", mode = "755" },
    { source = "../../packaging/linux/zimged.desktop", dest = "/usr/share/applications/zimged.desktop", mode = "644" },
    { source = "../../packaging/linux/zimged.svg", dest = "/usr/share/icons/hicolor/scalable/apps/zimged.svg", mode = "644" },
    { source = "../../packaging/linux/io.github.acastaner.zimged.metainfo.xml", dest = "/usr/share/metainfo/io.github.acastaner.zimged.metainfo.xml", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/zimged/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libwayland-client" = "*"
"libwayland-egl" = "*"
"libxkbcommon" = "*"
"libglvnd-egl" = "*"
"libglvnd-glx" = "*"
"libX11" = "*"
"libX11-xcb" = "*"
"libXcursor" = "*"
"libXrandr" = "*"
"libXi" = "*"

[package.metadata.generate-rpm.recommends]
"xdg-desktop-portal" = "*"
