# zimged's Flatpak (#41, spec §8.5). Secondary and not budgeted: the sandbox adds launch overhead
# (spec §1.2). It repackages the release tarball's binary (built in the release workflow's linux
# job), so the bundle runs exactly the binary of the .deb, .rpm and tarball. packaging/linux/build.sh
# flatpak stages this file next to that tarball as zimged-linux.tar.gz.
id: io.github.acastaner.zimged
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: zimged
rename-desktop-file: zimged.desktop
rename-icon: zimged
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A viewer opens any image, walks its folder for Siblings and saves next to it: a portal-only
  # sandbox would see the one file and none of its Siblings.
  - --filesystem=host
modules:
  - name: zimged
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/zimged /app/bin/zimged
      - install -Dm644 share/applications/zimged.desktop /app/share/applications/zimged.desktop
      - install -Dm644 share/icons/hicolor/scalable/apps/zimged.svg /app/share/icons/hicolor/scalable/apps/zimged.svg
      - install -Dm644 share/metainfo/io.github.acastaner.zimged.metainfo.xml /app/share/metainfo/io.github.acastaner.zimged.metainfo.xml
      # The desktop file is renamed to the app id; point the metainfo's launchable at the new name.
      - sed -i 's|>zimged.desktop<|>io.github.acastaner.zimged.desktop<|' /app/share/metainfo/io.github.acastaner.zimged.metainfo.xml
    sources:
      - type: archive
        path: zimged-linux.tar.gz
