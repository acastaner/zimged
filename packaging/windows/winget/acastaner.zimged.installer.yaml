# zimged's winget installer manifest (#42): a template, see acastaner.zimged.yaml.
# FileExtensions = every format zimged reads (spec §5.1), as in packaging/windows/zimged.wxs.
# The MSI only adds zimged to *Open with*; it never becomes the default handler (spec §8.5).
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: acastaner.zimged
PackageVersion: "@VERSION@"
MinimumOSVersion: 10.0.17763.0
InstallerType: wix
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
FileExtensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - bmp
  - ico
  - tif
  - tiff
  - avif
AppsAndFeaturesEntries:
  - DisplayName: zimged
    Publisher: Arnaud Castaner
    UpgradeCode: "{463029A1-EE94-4B1F-8BED-6B328584C5E2}"
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/acastaner/zimged/releases/download/v@VERSION@/zimged-@VERSION@-x86_64.msi
    InstallerSha256: "@SHA256@"
ManifestType: installer
ManifestVersion: 1.10.0
